# Поднимает сервис вместе с PostgreSQL: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threats
      POSTGRES_PASSWORD: threats
      POSTGRES_DB: threats
    # Порт открыт только на localhost: он нужен для `make test-integration`,
    # но не должен быть виден из сети.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threats -d threats"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy # ждём, пока база реально начнёт принимать подключения
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://threats:threats@db:5432/threats?sslmode=disable
      # Ключ берётся из .env (см. .env.example). Значение по умолчанию — только для локальной демонстрации.
      API_KEY: ${API_KEY:-dev-secret-key}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
